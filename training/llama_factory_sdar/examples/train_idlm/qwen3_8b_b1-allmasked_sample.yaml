# ============================================================================
# I-DLM: Introspective Diffusion Language Model Training
# Qwen3-8B, block_size=1, CE loss on both clean and noisy tokens
# Strict causal mask + logit shift (Dream shift)
# ============================================================================

### model
model_name_or_path: ../model/Qwen3-8B-b1-allmasked
train_from_scratch: false
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
# NOTE: This is a sample dataset for demonstration only, NOT the one used in the paper.
# Replace with your own dataset for actual training.
dataset: open_thoughts3_sample
template: qwen3
pretokenized: false
cutoff_len: 4096
block_length: 1
truncate_mode: cut
overwrite_cache: false
preprocessing_num_workers: 4
dataloader_num_workers: 4

### introspective training loss
ce_alpha: 0.2
idlm_loss_type: ar

### output
output_dir: ../output/idlm_qwen3_8b_b1
logging_steps: 5
save_steps: 250
save_total_limit: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
wandb_project: idlm-training

### train
run_name: idlm_qwen3_8b_b1
include_effective_tokens_per_second: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
